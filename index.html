<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارت دعوت عروسی | رضوانه و علی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-muted: #6e6e6e;
      --accent-gold: #c5a880;
      --accent-gold-hover: #b0936b;
      --border-color: #f0eae1;
      --danger: #c97a7e;
      --danger-hover: #b5676b;
      --success: #6fa388;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      position: relative;
    }

    .monogram {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: var(--accent-gold);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .header-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .guest-greeting {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 12px;
    }

    .invitation-text {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--text-main);
      margin-bottom: 25px;
    }

    .details-box {
      border-top: 1px dashed var(--border-color);
      border-bottom: 1px dashed var(--border-color);
      padding: 20px 0;
      margin-bottom: 25px;
    }

    .detail-row {
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      color: var(--text-muted);
      margin-left: 5px;
    }

    .location-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border-bottom: 1px solid var(--accent-gold);
      padding-bottom: 2px;
      transition: all 0.2s;
    }

    .location-link:hover {
      color: var(--accent-gold-hover);
      border-color: var(--accent-gold-hover);
    }

    .rsvp-section {
      margin-top: 25px;
    }

    .rsvp-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .rsvp-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      flex: 1;
    }

    .btn-accept {
      background-color: var(--accent-gold);
      color: #fff;
    }

    .btn-accept:hover {
      background-color: var(--accent-gold-hover);
    }

    .btn-decline {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-muted);
    }

    .btn-decline:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }
    .status-msg.success { color: var(--success); display: block; }
    .status-msg.danger { color: var(--danger); display: block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="monogram">R & A</div>
    <div class="header-sub">Save the Date</div>

    <div class="guest-greeting" id="guestName">مهمان گرامی</div>

    <p class="invitation-text" id="guestText">
      حضور شما در جشن پیوند ما موجب شادی و افتخار ما خواهد بود.
    </p>

    <div class="details-box">
      <div class="detail-row">
        <span class="detail-label">تاریخ:</span>
        <span>جمعه، ۲۴ مهر ۱۴۰۵</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">ساعت:</span>
        <span>۱۹:۰۰ الی ۲۳:۳۰</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">مکان:</span>
        <span>باغ تالار رویال</span>
      </div>
      <a href="https://neshan.org" target="_blank" class="location-link">📍 مشاهده موقعیت روی نقشه نشان</a>
    </div>

    <div class="rsvp-section">
      <p class="rsvp-title">لطفاً وضعیت حضور خود را تا تاریخ ۱۰ مهر اعلام فرمایید:</p>
      <div class="rsvp-buttons" id="btnGroup">
        <button class="btn btn-accept" onclick="submitRSVP('حاضر')">با افتخار شرکت می‌کنم</button>
        <button class="btn btn-decline" onclick="submitRSVP('غایب')">متاسفانه امکان حضور ندارم</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <script>
    // ۱. خواندن پارامترها از آدرس لینک (URL)
    const urlParams = new URLSearchParams(window.location.search);
    const guestId = urlParams.get('id') || '';
    const guestName = urlParams.get('name');
    const guestType = urlParams.get('type');

    // ۲. تنظیم نام و متن داینامیک
    if (guestName) {
      document.getElementById('guestName').innerText = decodeURIComponent(guestName) + ' عزیز';
    }

    const textElement = document.getElementById('guestText');
    if (guestType === 'family') {
      textElement.innerText = 'حضور گرم شما و خانواده محترمتان در جشن پیوند ما، شبی خاطره‌انگیز برایمان رقم خواهد زد.';
    } else if (guestType === 'couple') {
      textElement.innerText = 'با کمال میل و افتخار، شما و همسر گرامیتان را به جشن آغاز زندگی مشترکمان دعوت می‌کنیم.';
    }

    // ۳. تابع ارسال پاسخ به گوگل‌شیت
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqdJ2777LWcRUBvjHMSmAYy1Vr9o_mcVUptwuORu_zQDZ-DFHRVPtKYpOhpfveFljL/exec';

    function submitRSVP(responseStatus) {
      const statusMsg = document.getElementById('statusMsg');
      const btnGroup = document.getElementById('btnGroup');

      const buttons = btnGroup.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
      
      statusMsg.className = 'status-msg';
      statusMsg.innerText = 'در حال ثبت پاسخ...';
      statusMsg.style.display = 'block';

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: guestId,
          name: guestName ? decodeURIComponent(guestName) : 'ناشناس',
          status: responseStatus
        })
      })
      .then(() => {
        statusMsg.className = 'status-msg success';
        statusMsg.innerText = responseStatus === 'حاضر' 
          ? 'پاسخ شما با موفقیت ثبت شد. مشتاق دیدارتان هستیم! ❤️' 
          : 'پاسخ شما ثبت شد. جای شما بسیار خالی خواهد بود. 🌸';
      })
      .catch(error => {
        statusMsg.className = 'status-msg danger';
        statusMsg.innerText = 'خطایی در ثبت پاسخ رخ داد. لطفاً دوباره تلاش کنید.';
        buttons.forEach(btn => btn.disabled = false);
      });
    }
  </script>
</body>
</html>
